<ng-template #modal>
  <div *ngIf="modalConfig && modalConfig.modalTitle" class="modal-header" style="color: black;">
    <h5 class="">{{ modalConfig.modalTitle }}</h5>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()" style="font-weight: 400; font-size: 2rem;">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <ng-content></ng-content>
  </div>
</ng-template>
