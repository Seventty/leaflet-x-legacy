<div>

  <div class="d-flex justify-content-center mb-2">
    <div class="toggle-container">
      <button class="toggle-btn" [class.active]="selectedOption === 'geoarchivos'"
        (click)="selectOption('geoarchivos')">
        GeoArchivos
      </button>
      <button class="toggle-btn" [class.active]="selectedOption === 'shapefiles'" (click)="selectOption('shapefiles')">
        ShapeFiles
      </button>
    </div>
  </div>

  <div class="py-5 mb-2 text-center font-medium-5 text-uppercase grey my-drop-zone"
    [ngClass]="{'nv-file-over': hasBaseDropZoneOver}"
    [style.border-color]="selectedOption === 'geoarchivos' ? '#00C3AD' : '#008AE5'"
    [style.background-color]="selectedOption === 'geoarchivos' ? 'rgba(0, 195, 173, 0.02)' : 'rgba(0, 138, 229, 0.02)'"
    [style.border-radius]="'1rem'" ng2FileDrop [uploader]="uploader" (fileOver)="fileOverBase($event)"
    (onFileDrop)="addedFileToQueue()">
    <div>
      <svg *ngIf="selectedOption === 'geoarchivos'" xmlns="http://www.w3.org/2000/svg" width="70" height="71"
        fill="none">
        <path fill="#f4f4f5" d="M.5.5h51v59H.5z" />
        <ellipse cx="51.5" cy="53.5" fill="#00C3AD" rx="18" ry="17" />
      </svg>
      <svg *ngIf="selectedOption === 'shapefiles'" xmlns="http://www.w3.org/2000/svg" width="70" height="71"
        fill="none">
        <path fill="#f4f4f5" d="M.5.5h51v59H.5z" />
        <ellipse cx="51.5" cy="53.5" fill="#008AE5" rx="18" ry="17" />
      </svg>
    </div>

    <div class="mt-3">
      <span class="instruction-text">Arrastra los Documentos aquí o</span>
      <span class="clickable-text" [style.color]="selectedOption === 'geoarchivos' ? '#00C3AD' : '#008AE5'"
        (click)="handleFile(fileInput)" style="cursor: pointer; font-weight: bold;">
        selecciona archivo
      </span>
    </div>

    <input #fileInput type="file" ng2FileSelect [uploader]="uploader" [hidden]="true" [multiple]="multiple"
      [accept]="mimeType" (onFileSelected)="addedFileToQueue()" />
  </div>


  <div class="d-flex justify-content-between align-items-center mb-2 text-muted">
    <small class="mb-0">Tamaño Máximo: {{ maxFileSize }} mb</small>
  </div>

  <!-- Files uploaded panel -->
  <div *ngIf="uploader?.queue?.length !== 0">
    <span><b>Cola de archivos</b></span>
    <p>Cantidad de Archivos: {{ uploader?.queue?.length }}</p>

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th width="50%">Nombre del Archivo</th>
            <th class="text-center">Remover archivo</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of uploader?.queue">
            <td class="text-bold-600">{{ item?.file?.name }}</td>
            <td class="text-center">
              <button type="button" class="btn btn-danger" (click)="removeFileFromQueue(item)">
                <span class="fa fa-trash"></span>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-between flex-row">
    <div class="d-flex align-items-center">
      <div class="far fa-question-circle"
        style="cursor: pointer; font-size: 1.2rem; color: #818589; margin-right: 0.5rem;" (click)="openInfoModal()">
      </div>
      <p class="mb-0" style="color: #818589">Help Center</p>
    </div>

    <div class="d-flex">
      <button type="button" class="btn btn-outline-secondary mr-2" (click)="modalReference.close()">
        Cancelar
      </button>
      <button type="button" class="btn btn-primary" [disabled]="isQueueNotEmpty" (click)="sendFiles()">
        Importar
      </button>
    </div>
  </div>

</div>

<UIModal [modalConfig]="infoModalConfig" [modalOption]="infoModalOption" #infoModal>
  <div class="d-flex flex-wrap">
    <div class="p-1" *ngFor="let item of fileType">
      <p class="info-pill d-inline-block pl-2 pr-2">{{item}}</p>
    </div>
  </div>
</UIModal>
